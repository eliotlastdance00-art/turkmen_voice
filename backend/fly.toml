# Fly.io config — cheapest persistent option for this API.
#
#   cd backend
#   fly launch --copy-config --name turkmen-ses-api --region fra
#   fly volumes create turkmen_ses_data --size 3 --region fra
#   fly secrets set ADMIN_TOKEN=$(openssl rand -hex 16)
#   fly deploy
#
# URL: https://turkmen-ses-api.fly.dev  (API base: .../api/v1)
app = "turkmen-ses-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/v1/health"

[[mounts]]
  source = "turkmen_ses_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
