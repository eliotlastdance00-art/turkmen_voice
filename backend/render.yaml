# Render blueprint — deploy:  New + > Blueprint > pick this repo (root: backend)
#
# Free plan note: the service sleeps after 15 min and *persistent disks are
# paid*. Without a disk the sqlite/audio files live in the container and are
# lost on redeploy — fine for testing, not for a real corpus.
services:
  - type: web
    name: turkmen-ses-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter          # free plan has no persistent disk
    healthCheckPath: /api/v1/health
    autoDeploy: true
    disk:
      name: turkmen-ses-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: DATA_DIR
        value: /data
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ADMIN_TOKEN
        generateValue: true      # copy it into the panel's token field
      - key: CORS_ORIGINS
        value: "*"
      - key: AUTO_APPROVE_MIN_RATINGS
        value: "3"
      - key: AUTO_APPROVE_MIN_SCORE
        value: "4.0"
