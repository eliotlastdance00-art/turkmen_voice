# Öz serweriňizde (VPS) işletmek üçin:  docker compose up -d
# Caddy awtomatiki HTTPS sertifikat alýar (domeniňiz bar bolsa).
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      AUTO_APPROVE_MIN_RATINGS: "3"
      AUTO_APPROVE_MIN_SCORE: "4.0"
    volumes:
      - turkmen_ses_data:/data
      - ./backups:/backups
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - turkmen_ses_data:/data:ro
      - ./backups:/backups
    entrypoint: >
      sh -c "while true; do
        ts=$$(date +%Y%m%d-%H%M);
        tar czf /backups/turkmen-ses-$$ts.tar.gz -C /data . 2>/dev/null;
        find /backups -name 'turkmen-ses-*.tar.gz' -mtime +14 -delete;
        sleep 86400;
      done"

volumes:
  turkmen_ses_data:
  caddy_data:
  caddy_config:
