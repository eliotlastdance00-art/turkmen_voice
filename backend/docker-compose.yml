# Öz serweriňizde (VPS) işletmek üçin:  docker compose up -d --build
#
#   cd backend
#   ADMIN_TOKEN=$(openssl rand -hex 16) \
#   PUBLIC_BASE_URL=https://api.sizin-domen.tm \
#   docker compose up -d --build
#
# SQLite bazasy + ses faýllary `turkmen_ses_data` hemişelik diskinde saklanýar.
# API 8000-nji portda diňleýär — HTTPS üçin öňünde nginx/Caddy goýuň.
# (FastAPI Cloud ulanylsa, bu faýl gerek däl: docs/DEPLOYMENT.md → 2-nji bölüm.)

services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      PORT: "8000"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN goýulmaly — openssl rand -hex 16}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      AUTO_APPROVE_MIN_RATINGS: ${AUTO_APPROVE_MIN_RATINGS:-3}
      AUTO_APPROVE_MIN_SCORE: ${AUTO_APPROVE_MIN_SCORE:-4.0}
    volumes:
      - turkmen_ses_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Gündelik arhiw: ./backups/turkmen-ses-YYYYMMDD-HHMM.tar.gz (14 gün saklanýar)
  backup:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - turkmen_ses_data:/data:ro
      - ./backups:/backups
    entrypoint: >
      sh -c "while true; do
        ts=$$(date +%Y%m%d-%H%M);
        tar czf /backups/turkmen-ses-$$ts.tar.gz -C /data . 2>/dev/null;
        find /backups -name 'turkmen-ses-*.tar.gz' -mtime +14 -delete;
        sleep 86400;
      done"

volumes:
  turkmen_ses_data:
