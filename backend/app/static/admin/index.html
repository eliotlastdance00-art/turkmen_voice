<!doctype html>
<html lang="tk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Türkmen Ses — Admin</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#17322f;background:#f5f8f7}*{box-sizing:border-box}body{margin:0}.top{background:#0b6e69;color:#fff;padding:28px 6vw;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:28px}.top span{opacity:.8}.wrap{max-width:1200px;margin:28px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 18px #17322f12}.metric{font-size:30px;font-weight:800;margin-top:8px}.toolbar{display:flex;gap:12px;align-items:center;margin:28px 0 14px}.toolbar select,.toolbar button{border:1px solid #ccd8d5;background:#fff;padding:11px 14px;border-radius:10px;font:inherit}.toolbar button{background:#0b6e69;color:white;cursor:pointer}.table{background:#fff;border-radius:16px;overflow:auto;box-shadow:0 4px 18px #17322f12}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:15px;border-bottom:1px solid #edf1f0;font-size:14px}th{font-size:12px;text-transform:uppercase;color:#66817d;background:#fbfcfc}.status{padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700}.pending{background:#fff3cd;color:#856404}.approved{background:#d1f2e8;color:#146c50}.rejected{background:#f8d7da;color:#842029}.actions{display:flex;gap:6px;align-items:center}.actions button{border:0;border-radius:8px;padding:8px 10px;cursor:pointer}.ok{background:#d1f2e8;color:#146c50}.no{background:#f8d7da;color:#842029}audio{width:190px;height:34px}.empty{text-align:center;padding:50px;color:#66817d}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.top{padding:22px}.wrap{margin-top:18px}}
</style></head>
<body>
<header class="top"><div><h1>Türkmen Ses</h1><span>Dataset admin panel</span></div><button onclick="exportDataset()" style="padding:10px 14px;border:0;border-radius:9px;cursor:pointer">JSONL eksport</button></header>
<main class="wrap"><section class="grid"><div class="card">Jemi ýazgy<div id="total" class="metric">—</div></div><div class="card">Garaşýan<div id="pending" class="metric">—</div></div><div class="card">Kabul edilen<div id="approved" class="metric">—</div></div><div class="card">Ret edilen<div id="rejected" class="metric">—</div></div></section>
<div class="toolbar"><h2 style="margin-right:auto">Ýazgylar</h2><select id="filter" onchange="load()"><option value="">Ählisi</option><option value="pending">Garaşýan</option><option value="approved">Kabul edilen</option><option value="rejected">Ret edilen</option></select><button onclick="load()">Täzele</button></div>
<section class="table"><table><thead><tr><th>Sözlem</th><th>Ses</th><th>Status</th><th>Wagt</th><th>Hereket</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>Ýazgy tapylmady.</div></section></main>
<script>
const API='/api/v1';
async function request(path, options={}){const r=await fetch(API+path,options);if(!r.ok)throw new Error(await r.text());return r.json()}
async function load(){try{const all=await request('/admin/recordings');const counts={pending:0,approved:0,rejected:0};all.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);document.querySelector('#total').textContent=all.length;document.querySelector('#pending').textContent=counts.pending||0;document.querySelector('#approved').textContent=counts.approved||0;document.querySelector('#rejected').textContent=counts.rejected||0;const filter=document.querySelector('#filter').value;const data=filter?all.filter(x=>x.status===filter):all;const rows=document.querySelector('#rows');rows.innerHTML='';document.querySelector('#empty').hidden=!!data.length;data.forEach(x=>{const tr=document.createElement('tr');tr.innerHTML=`<td style="max-width:280px">${escapeHtml(x.text)}<br><small>${x.id}</small></td><td><audio controls src="/api/v1/admin/recordings/${x.id}/audio"></audio></td><td><span class="status ${x.status}">${x.status}</span></td><td>${new Date(x.created_at).toLocaleString()}</td><td>${x.status==='pending'?`<div class="actions"><button class="ok" onclick="review('${x.id}',true)">Kabul et</button><button class="no" onclick="review('${x.id}',false)">Ret et</button></div>`:'—'}</td>`;rows.appendChild(tr)})}catch(e){alert('API ýalňyşlygy: '+e.message)}}
async function review(id,approved){const reason=approved?null:(prompt('Ret etmegiň sebäbi:')||'Hil barlagyndan geçmedi');await fetch(`${API}/admin/recordings/${id}/review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved,reason})});load()}
function exportDataset(){window.location.href=API+'/admin/export.jsonl'}function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}load();
</script></body></html>
