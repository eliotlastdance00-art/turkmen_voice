<!doctype html>
<html lang="tk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Türkmen Ses — Admin</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#12312e;--muted:#6a8480;--brand:#0b6e69;--brand2:#12a594;--warn:#fde68a;--ok:#d1f2e8;--no:#fbd5d5;--line:#e6edea;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}
a{color:var(--brand)}
header{background:linear-gradient(120deg,#0b6e69,#12a594);color:#fff;padding:26px 6vw;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:26px;letter-spacing:.2px}
header small{opacity:.85;display:block;margin-top:4px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.top-actions button,.top-actions input{border:0;border-radius:10px;padding:11px 14px;font:inherit;cursor:pointer}
.top-actions input{cursor:text;min-width:190px;opacity:.95}
.top-actions button{background:#ffffff1f;color:#fff;border:1px solid #ffffff55}
.top-actions button.primary{background:#fff;color:var(--brand);font-weight:600}
main{max-width:1240px;margin:26px auto;padding:0 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 6px 22px #12312e0f;border:1px solid var(--line)}
.metric{font-size:28px;font-weight:800;margin-top:6px}
.metric small{font-size:13px;font-weight:500;color:var(--muted)}
.section{margin-top:26px}
.section h2{font-size:17px;margin:0 0 12px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 12px}
select,input[type=search]{border:1px solid #cfdcd8;background:#fff;border-radius:10px;padding:10px 12px;font:inherit}
button.action{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit}
table{width:100%;border-collapse:collapse;min-width:900px}
.table-wrap{background:#fff;border-radius:16px;overflow:auto;border:1px solid var(--line)}
th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#fafcfb;position:sticky;top:0}
tr:hover td{background:#f9fcfb}
.status{display:inline-block;padding:4px 9px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase}
.pending{background:#fff3cd;color:#856404}.approved{background:var(--ok);color:#0f5c46}.rejected{background:var(--no);color:#8a2c2c}
.score{font-weight:700}.stars{color:#f0a500;letter-spacing:1px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{border:0;border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit;font-size:13px}
.ok{background:var(--ok);color:#0f5c46}.no{background:var(--no);color:#8a2c2c}.ghost{background:#eef4f2;color:#33514d}
audio{width:210px;height:34px}
.empty{text-align:center;padding:46px;color:var(--muted)}
.bar{height:8px;background:#e7efed;border-radius:99px;overflow:hidden;margin-top:10px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,#12a594,#0b6e69)}
.spark{display:flex;align-items:flex-end;gap:4px;height:52px;margin-top:10px}
.spark i{flex:1;background:#cfe8e4;border-radius:4px 4px 0 0;min-height:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:#eef4f2;border-radius:99px;padding:4px 10px;font-size:12px;color:#33514d}
.warn{background:#fff8e6;border:1px solid #f3e2b3;color:#7a5c12;border-radius:12px;padding:12px 14px;font-size:13px;margin-top:12px}
.hidden{display:none}
.tabs{display:flex;gap:8px;margin-top:22px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font:inherit}
.tabs button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
footer{color:var(--muted);font-size:13px;margin-top:30px;text-align:center}
</style></head>
<body>
<header>
  <div><h1>Türkmen Ses</h1><small>Dataset admin panel · Whisper-ready QA</small></div>
  <div class="top-actions">
    <input id="token" type="password" placeholder="Admin token (X-Admin-Token)">
    <button class="primary" onclick="saveToken()">Token sakla</button>
    <button onclick="loadAll()">Täzele</button>
  </div>
</header>

<main>
  <section class="grid" id="metrics"></section>

  <section class="card section">
    <h2>Dataset saglygy (Whisper taýýarlygy)</h2>
    <div class="bar"><span id="progress" style="width:0%"></span></div>
    <div id="progressText" class="chip">—</div>
    <div class="chips" id="chips"></div>
    <div id="warnings"></div>
  </section>

  <section class="card section">
    <h2>Iň işjeň 14 gün</h2>
    <div class="spark" id="spark"></div>
  </section>

  <div class="toolbar">
    <h2 style="margin:0 auto 0 0;font-size:17px">Ýazgylar</h2>
    <input id="search" type="search" placeholder="Tekst boýunça gözle..." oninput="debouncedLoad()">
    <select id="filter" onchange="load()">
      <option value="">Ählisi</option><option value="pending">Garaşýan</option>
      <option value="approved">Kabul edilen</option><option value="rejected">Ret edilen</option>
    </select>
    <select id="exporter" onchange="doExport(this.value)">
      <option value="">Eksport...</option>
      <option value="export.jsonl">JSONL (metadata bilen)</option>
      <option value="export.whisper.jsonl">Whisper JSONL</option>
      <option value="export.csv">CSV</option>
      <option value="export.tsv">TSV (Common Voice stil)</option>
      <option value="export.zip">ZIP (audio + metadata)</option>
      <option value="dataset/report.json">Report JSON</option>
    </select>
    <button class="action" onclick="load()">Täzele</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Sözlem</th><th>Ses</th><th>Hillilik</th><th>Status</th><th>Wagt / format</th><th>Hereket</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>Ýazgy tapylmady.</div>
  </div>

  <section class="card section">
    <h2>Iň gowy gürleýjiler</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>#</th><th>Ulanyjy</th><th>Ball</th><th>Dereje</th><th>Ýazgy</th><th>Sekunt</th><th>Orta baha</th><th>Berlen baha</th></tr></thead>
      <tbody id="leaders"></tbody>
    </table></div>
  </section>

  <footer>Türkmen Ses API · <span id="version">—</span></footer>
</main>

<script>
const API = '/api/v1';
let token = localStorage.getItem('adminToken') || '';
document.querySelector('#token').value = token;

function headers(extra = {}) {
  const base = { ...extra };
  if (token) base['X-Admin-Token'] = token;
  return base;
}
function saveToken() {
  token = document.querySelector('#token').value.trim();
  localStorage.setItem('adminToken', token);
  loadAll();
}
async function request(path, options = {}) {
  const response = await fetch(API + path, { ...options, headers: headers({ 'Accept': 'application/json', ...(options.headers || {}) }) });
  if (!response.ok) throw new Error((await response.text()) || response.statusText);
  return response.status === 204 ? null : response.json();
}
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
}
function stars(score) {
  if (score == null) return '<span style="color:#93a8a4">—</span>';
  const full = Math.round(score);
  return `<span class="stars">${'★'.repeat(full)}${'☆'.repeat(Math.max(0, 5 - full))}</span> <span class="score">${score}</span>`;
}
function seconds(value) { return `${(value / 1000).toFixed(1)} s`; }

let debounce;
function debouncedLoad() { clearTimeout(debounce); debounce = setTimeout(load, 320); }

async function loadHealth() {
  const health = await request('/health');
  document.querySelector('#version').textContent = `v${health.version} · ${health.admin_protected ? 'token bilen goralan' : 'açyk režim (token goýuň!)'}`;
}

async function loadStats() {
  const stats = await request('/admin/stats');
  const metrics = [
    ['Jemi ýazgy', stats.recordings_total, 'klip'],
    ['Kabul edilen', stats.approved, 'Whisper üçin taýýar'],
    ['Garaşýan', stats.pending, 'admin barlagy'],
    ['Ses wagt', stats.hours_total + ' sag', stats.seconds_total + ' sekunt'],
    ['Gürleýjiler', stats.contributors, stats.speakers_with_approved + ' kabul edilen'],
    ['Baha berlen', stats.ratings_total, 'jemgyýetçilik bahalary'],
    ['Sözlemler', stats.sentences_total, stats.packages_total + ' paket'],
    ['Diskde', stats.storage_mb + ' MB', 'audio + metadata'],
  ];
  document.querySelector('#metrics').innerHTML = metrics.map(([title, value, hint]) =>
    `<article class="card"><div>${title}</div><div class="metric">${value ?? '—'}<small> ${hint || ''}</small></div></article>`).join('');

  const percent = Math.min(100, Math.round((stats.progress || 0) * 100));
  document.querySelector('#progress').style.width = percent + '%';
  document.querySelector('#progressText').textContent =
    `Maksat: ${stats.target_hours} sagat arassa ses · häzir ${percent}% (${stats.hours_total} sag)`;

  const chips = [
    `Orta baha: ${stats.avg_quality ?? '—'}`,
    `Barlanan (verified): ${stats.verified}`,
    `Orta dowamlylyk: ${(stats.avg_duration_ms / 1000).toFixed(1)} s`,
    ...(stats.top_categories || []).map((item) => `${item.category}: ${item.recordings}`),
  ];
  document.querySelector('#chips').innerHTML = chips.map((text) => `<span class="chip">${escapeHtml(text)}</span>`).join('');

  const daily = (stats.daily || []).slice().reverse();
  const max = Math.max(1, ...daily.map((item) => item.recordings));
  document.querySelector('#spark').innerHTML = daily.map((item) =>
    `<i title="${item.day}: ${item.recordings} ýazgy" style="height:${Math.max(4, (item.recordings / max) * 100)}%"></i>`).join('') || '<span class="chip">Maglumat ýok</span>';

  if (!stats.ratings_total) {
    document.querySelector('#warnings').innerHTML =
      '<div class="warn">Jemgyýetçilik bahalary ýok. Ulanyjylar bir-biriniň ýazgylaryny bahalamasa, hil süzgüji işlemeýär — mobil programmadaky «Baha ber» bölümini mäsgewer ediň.</div>';
  } else {
    document.querySelector('#warnings').innerHTML = '';
  }

  try {
    const report = await request('/admin/dataset/report.json');
    const counts = report.warning_counts || {};
    const lines = Object.entries(counts).map(([key, value]) => `${key}: ${value}`);
    const boxes = [
      `Klip: ${report.totals.clips} · sagat: ${report.totals.hours} · gürleýji: ${report.totals.speakers}`,
      `Unikal sözlem: ${report.totals.unique_prompts} · orta söz: ${report.totals.avg_words_per_clip}`,
      `Dublikat sha256: ${(report.duplicates || []).length} · gaýtalanan prompt: ${(report.repeated_prompts || []).length}`,
      lines.length ? 'Duýduryşlar → ' + lines.join(', ') : 'Duýduryş ýok ✔',
    ];
    document.querySelector('#warnings').innerHTML = boxes.map((text) => `<div class="warn">${escapeHtml(text)}</div>`).join('');
  } catch (error) {
    /* report is optional */
  }
}

async function loadLeaders() {
  const { entries } = await request('/leaderboard?limit=15');
  document.querySelector('#leaders').innerHTML = entries.map((entry) => `<tr>
    <td>${entry.rank}</td><td><b>${escapeHtml(entry.display_name)}</b><br><small>${entry.user_id}</small></td>
    <td>${entry.points}</td><td>${escapeHtml(entry.level_name)}</td><td>${entry.recordings}</td>
    <td>${seconds(entry.seconds)}</td><td>${entry.avg_score ?? '—'}</td><td>${entry.ratings_given}</td></tr>`).join('');
}

async function load() {
  try {
    const status = document.querySelector('#filter').value;
    const search = document.querySelector('#search').value.trim();
    const params = new URLSearchParams();
    if (status) params.set('status', status);
    if (search) params.set('q', search);
    const data = await request('/admin/recordings?' + params.toString());
    const rows = document.querySelector('#rows');
    document.querySelector('#empty').hidden = data.length > 0;
    rows.innerHTML = data.map((item) => {
      const actions = [];
      if (item.status !== 'approved') actions.push(`<button class="ok" onclick="review('${item.id}',true)">Kabul et</button>`);
      if (item.status !== 'rejected') actions.push(`<button class="no" onclick="review('${item.id}',false)">Ret et</button>`);
      actions.push(`<button class="ghost" onclick="removeRecording('${item.id}')">Poz</button>`);
      return `<tr>
        <td style="max-width:300px">${escapeHtml(item.text)}<br><small>${item.id} · ${escapeHtml(item.sentence_id)}</small>
          ${item.rejection_reason ? `<br><small style="color:#8a2c2c">${escapeHtml(item.rejection_reason)}</small>` : ''}</td>
        <td><audio controls preload="none" src="${API}/recordings/${item.id}/audio"></audio></td>
        <td>${stars(item.community_score)}<br><small>${item.rating_count} baha${item.verified ? ' · ✔ verified' : ''}</small></td>
        <td><span class="status ${item.status}">${item.status}</span></td>
        <td>${(item.duration_ms / 1000).toFixed(1)} s · ${item.sample_rate} Hz<br><small>${item.channels}ch · ${item.bits_per_sample}bit · ${(item.size_bytes / 1024).toFixed(0)} KB</small></td>
        <td><div class="actions">${actions.join('')}</div></td>
      </tr>`;
    }).join('');
  } catch (error) {
    alert('API ýalňyşlygy: ' + error.message);
  }
}

async function review(id, approved) {
  const reason = approved ? null : (prompt('Ret etmegiň sebäbi:', 'Hil barlagyndan geçmedi') || 'Hil barlagyndan geçmedi');
  await request(`/admin/recordings/${id}/review`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ approved, reason }),
  });
  load();
}
async function removeRecording(id) {
  if (!confirm('Bu ýazgy we audio faýl hemişelik pozular. Dowam edeliňmi?')) return;
  await request(`/admin/recordings/${id}`, { method: 'DELETE' });
  load();
}
function doExport(kind) {
  if (!kind) return;
  const url = `${API}/admin/${kind}` + (token ? `?x=1` : '');
  fetch(`${API}/admin/${kind}`, { headers: headers() })
    .then(async (response) => {
      if (!response.ok) throw new Error(await response.text());
      const blob = await response.blob();
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = kind.split('/').pop();
      link.click();
      URL.revokeObjectURL(link.href);
    })
    .catch((error) => alert('Eksport ýalňyşlygy: ' + error.message));
  document.querySelector('#exporter').value = '';
}

async function loadAll() { await loadStats(); await load(); await loadLeaders(); await loadHealth(); }
loadAll();
</script>
</body></html>
