name: turkmen_ses
description: Offline-first Turkmen speech data collection app.
publish_to: 'none'
version: 0.2.0+2

environment:
  # record: ^7.0.0  →  Flutter >=3.44.0 / Dart >=3.12.0 talap edýär
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.4
  path: ^1.9.0
  record: ^7.0.0
  just_audio: ^0.9.40
  connectivity_plus: ^6.0.5
  dio: ^5.7.0
  sqlite3_flutter_libs: ^0.5.24
  uuid: ^4.5.0
  intl: ^0.19.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
  assets:
    # Sözlem goraghanasy programmanyň içinde — internet bolmasa-da tekst bar.
    # Çeşme: backend/app/seed/sentences_seed.json (tools/sync_seed_asset.py).
    - assets/sentences_seed.json
    # Brend ikonasy (Android mipmap-lary hem şondan öndürilýär):
    # tools/build_app_icons.py
    - assets/branding/app_icon_512.png
