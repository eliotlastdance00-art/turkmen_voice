name: Build Android Release APK

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ is committed to the repo (with RECORD_AUDIO + INTERNET
      # permissions in app/src/main/AndroidManifest.xml), so no
      # `flutter create` / manifest-patching step is needed.
      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Resolve API base url
        id: api
        run: |
          # Release APK hökman hakyky serwere birikmeli: boş bolsa build
          # düşündirişli ýalňyşlyk bilen saklanýar (önüň ýalňyş APK-ny
          # ýaýratmazlyk üçin).
          url="${{ vars.API_BASE_URL }}"
          if [ -z "$url" ]; then
            echo "::error title=API_BASE_URL goýulmadyk::Settings → Secrets and variables → Actions → Variables → API_BASE_URL = https://turkmen-voice-09885e66.fastapicloud.dev/api/v1 goýuň."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "APK şu salga birikdirilýär: $url"

      - name: Backend saglyk barlagy
        continue-on-error: true
        run: |
          base="${{ steps.api.outputs.url }}"
          root="${base%/api/v1}"
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' -m 20 "$root/api/v1/health" || true)
          cat /tmp/health.json 2>/dev/null || true
          echo
          if [ "$code" = "200" ]; then
            echo "✅ Backend jogap berýär (HTTP $code) — $root"
          else
            echo "::warning title=Backend jogap bermedi::HTTP $code — $root"
          fi

      # The release APK is signed with the debug key (see signingConfig in
      # android/app/build.gradle.kts) — fine for testing. Publishing to the
      # Play Store requires a custom release keystore.
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ steps.api.outputs.url }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: turkmen-ses-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
