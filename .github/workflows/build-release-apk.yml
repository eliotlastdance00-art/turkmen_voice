name: Build Android Release APK

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=android --project-name turkmen_ses

      - name: Add Android microphone permission
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse("android/app/src/main/AndroidManifest.xml")
          root = tree.getroot()
          perm = ET.Element("uses-permission")
          perm.set("{http://schemas.android.com/apk/res/android}name", "android.permission.RECORD_AUDIO")
          root.insert(0, perm)
          tree.write("android/app/src/main/AndroidManifest.xml", encoding="utf-8", xml_declaration=True)
          '

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: turkmen-ses-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
