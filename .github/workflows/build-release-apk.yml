name: Build Android Release APK

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ is committed to the repo (with RECORD_AUDIO + INTERNET
      # permissions in app/src/main/AndroidManifest.xml), so no
      # `flutter create` / manifest-patching step is needed.
      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      # The release APK is signed with the debug key (see signingConfig in
      # android/app/build.gradle.kts) — fine for testing. Publishing to the
      # Play Store requires a custom release keystore.
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: turkmen-ses-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
