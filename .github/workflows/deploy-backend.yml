name: Deploy backend

# Backend-i serwere çykarmak. Haýsy hiliň işleýändigi çeşmä bagly:
#
#   RENDER_DEPLOY_HOOK  → Render Blueprint/deploy hook URL (Secrets)
#   FLY_API_TOKEN       → flyctl token (Secrets)
#   DEPLOY_SSH_HOST + DEPLOY_SSH_USER + DEPLOY_SSH_KEY → öz VPS-iňiz (docker compose)
#
# Hiç biri goýulmadyk bolsa, diňe testler we image build işleýär — hiç zat bozulmaýar.

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  render:
    name: Trigger Render deploy
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy hook bar bolsa iber
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK ýok — Render tarapyndan awtomatik deploy (autoDeploy: true) işleýär."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Render deploy başladyldy."

  fly:
    name: Deploy to Fly.io (islege görä)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fly token ýok bolsa geç
        id: guard
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.guard.outputs.skip != 'true'
      - name: fly deploy
        if: steps.guard.outputs.skip != 'true'
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

  vps:
    name: Deploy to VPS (docker compose, islege görä)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Sunucu bar bolsa dowam et
        id: guard
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_SSH_* secretleri ýok — VPS deploy geçirilýär."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip == 'false'

      - name: Copy backend to server
        if: steps.guard.outputs.skip == 'false'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "backend/*"
          target: "/opt/turkmen-ses"
          strip_components: 1

      - name: Rebuild and restart
        if: steps.guard.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/turkmen-ses
            docker compose up -d --build
            docker compose exec -T api python -c "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').read().decode())"
