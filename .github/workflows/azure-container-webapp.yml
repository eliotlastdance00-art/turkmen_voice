# Azure Web App (container) deploy — backend/app üçin.
#
# Gerekli sazlamalar:
#   1) Secret:  AZURE_WEBAPP_PUBLISH_PROFILE   (Web App → Overview → Publish profile)
#   2) Variable: AZURE_WEBAPP_NAME             (mysal: turkmen-ses-api)
#   3) Web App → Configuration → Application settings:
#        DATA_DIR=/home/data           (Azure-da hemişelik saklanýan ýol)
#        ADMIN_TOKEN=<güýçli token>
#        WEBSITES_PORT=8000
#
# Diqqat: Azure Web App-de konteýner konfigurasiýasy .env-de däl, portal
# App Settings bölüminde goýulýar.

name: Deploy backend to Azure Web App

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  IMAGE: ghcr.io/${{ github.repository }}/turkmen-ses-api

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Guard (app name + publish profile barmy?)
        run: |
          if [ -z "${{ env.AZURE_WEBAPP_NAME }}" ] || [ -z "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" ]; then
            echo "::error::AZURE_WEBAPP_NAME variable we AZURE_WEBAPP_PUBLISH_PROFILE secret goýulmaly."
            exit 1
          fi

      - name: Deploy container
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: '${{ env.IMAGE }}:${{ github.sha }}'
