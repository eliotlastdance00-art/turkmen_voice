name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test:
    name: Contract tests (frontend ↔ backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run API contract tests
        run: python -m pytest tests -q

      - name: Smoke test a live server
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8010 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8010/api/v1/health >/dev/null && break || sleep 1
          done
          python scripts/smoke_test.py --base-url http://127.0.0.1:8010/api/v1

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Dockerfile
        run: docker build -t turkmen-ses-api:ci ./backend
