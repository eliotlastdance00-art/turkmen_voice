name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name turkmen_ses

      - name: Add Android microphone permission
        run: sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml

      - name: Fix plugin Gradle compatibility
        run: |
          # Force all sub-projects (plugins) to use a compatible compileSdkVersion
          # This prevents "Could not get unknown property 'flutter'" errors from
          # plugins that use the legacy build.gradle format.
          cat >> android/build.gradle << 'EOF'

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace project.group ?: project.name
                          }
                          compileSdkVersion 34
                      }
                  }
              }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: turkmen-ses-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
