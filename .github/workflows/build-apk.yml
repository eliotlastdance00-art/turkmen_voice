name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name turkmen_ses

      - name: Add Android microphone permission
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse("android/app/src/main/AndroidManifest.xml")
          root = tree.getroot()
          perm = ET.Element("uses-permission")
          perm.set("{http://schemas.android.com/apk/res/android}name", "android.permission.RECORD_AUDIO")
          root.insert(0, perm)
          tree.write("android/app/src/main/AndroidManifest.xml", encoding="utf-8", xml_declaration=True)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: turkmen-ses-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
