name: Build Android APK

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ is committed to the repo (RECORD_AUDIO + INTERNET permissions
      # and the cleartext network config for local testing), so no
      # `flutter create` / manifest-patching step is needed.
      - name: Install dependencies
        run: |
          set +e
          flutter pub get > /tmp/pub.log 2>&1
          status=$?
          cat /tmp/pub.log
          if [ $status -ne 0 ]; then
            tail -8 /tmp/pub.log | while IFS= read -r line; do echo "::error title=pub-get::$line"; done
          fi
          exit $status

      - name: Generate Drift code
        run: |
          set +e
          dart run build_runner build --delete-conflicting-outputs > /tmp/br.log 2>&1
          status=$?
          tail -25 /tmp/br.log
          if [ $status -ne 0 ]; then
            grep -iE "error|severe" /tmp/br.log | tail -8 | while IFS= read -r line; do echo "::error title=build-runner::$line"; done
          fi
          exit $status

      - name: Analyze
        run: |
          set +e
          flutter analyze > /tmp/analyze.log 2>&1
          status=$?
          tail -40 /tmp/analyze.log
          if [ $status -ne 0 ]; then
            grep -E "•|error|warning|info" /tmp/analyze.log | tail -8 | while IFS= read -r line; do echo "::error title=flutter-analyze::$line"; done
          fi
          exit $status

      - name: Widget tests
        run: |
          set +e
          flutter test > /tmp/test.log 2>&1
          status=$?
          tail -30 /tmp/test.log
          if [ $status -ne 0 ]; then
            grep -iE "error|failed|expected|actual" /tmp/test.log | tail -8 | while IFS= read -r line; do echo "::error title=flutter-test::$line"; done
          fi
          exit $status

      - name: Resolve API base url
        id: api
        run: |
          # Repository variable: Settings → Secrets and variables → Actions →
          # Variables → API_BASE_URL = https://<app>.fastapicloud.dev/api/v1
          # (doly görnüşi: docs/DEPLOYMENT.md, 3.1 bölüm)
          url="${{ vars.API_BASE_URL }}"
          if [ -z "$url" ]; then
            url="http://10.0.2.2:8000/api/v1"
            echo "::warning title=API_BASE_URL goýulmadyk::APK emulyator salgysyna ($url) birikdirilýär — hakyky beta APK üçin repo variable goýuň: https://turkmen-voice-09885e66.fastapicloud.dev/api/v1"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "APK şu salga birikdirilýär: $url"

      # Serwer jogap berýärmi? (diňe habar berýär — build-y saklamaýar)
      - name: Backend saglyk barlagy
        if: ${{ !contains(steps.api.outputs.url, '10.0.2.2') }}
        continue-on-error: true
        run: |
          base="${{ steps.api.outputs.url }}"
          root="${base%/api/v1}"
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' -m 20 "$root/api/v1/health" || true)
          cat /tmp/health.json 2>/dev/null || true
          echo
          if [ "$code" = "200" ]; then
            echo "✅ Backend jogap berýär (HTTP $code) — $root"
          else
            echo "::warning title=Backend jogap bermedi::HTTP $code — $root (deploy gutarmadyk ýa-da salgy ýalňyş bolup biler)"
          fi

      - name: Build debug APK
        run: |
          set +e
          flutter build apk --debug --dart-define=API_BASE_URL=${{ steps.api.outputs.url }} > /tmp/apk.log 2>&1
          status=$?
          tail -30 /tmp/apk.log
          if [ $status -ne 0 ]; then
            grep -iE "error|FAILURE|Exception|not found" /tmp/apk.log | tail -8 | while IFS= read -r line; do echo "::error title=apk-build::$line"; done
          fi
          exit $status

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: turkmen-ses-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Report logs to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### CI log — ${{ github.workflow }} (\`${{ github.sha }}\`)"
            echo
            for f in /tmp/pub.log /tmp/br.log /tmp/analyze.log /tmp/test.log /tmp/apk.log /tmp/pytest.log; do
              if [ -f "$f" ]; then
                echo "<details><summary>$f</summary>"
                echo
                echo '```'
                tail -c 7000 "$f"
                echo '```'
                echo "</details>"
              fi
            done
          } > /tmp/pr-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file /tmp/pr-comment.md || true
